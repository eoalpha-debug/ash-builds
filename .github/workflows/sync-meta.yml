name: Sync Meta Data (HoK Camp oficial)

# Roda quando o painel admin chamar (workflow_dispatch)
# e automaticamente a cada 3 dias ao meio-dia (12:00 UTC).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 */3 * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instala dependências
        run: pip install --user hok-camp-api orjson httpx

      - name: Atualiza dados oficiais do Camp global (heroes/WR/patch)
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: python tools/sync_camp_full.py

      - name: Copia outputs para os assets do app
        run: |
          cp tools/out/camp_full.json                app/src/main/assets/meta/camp_full.json
          cp tools/out/camp_patch.json               app/src/main/assets/meta/camp_patch.json
          cp tools/out/camp_rankings_snapshot.json   app/src/main/assets/meta/rankings.json

      - name: Atualiza builds/counters da comunidade BR
        run: |
          python tools/sync_hokpro_builds.py || echo "hokpro falhou (seguindo em frente)"
          python tools/sync_counters.py      || echo "counters falhou (seguindo em frente)"

      - name: Commit e push dos dados atualizados
        run: |
          git config --local user.email "bot@ash-builds.local"
          git config --local user.name "Ash Builds Bot"
          git add app/src/main/assets/meta/
          git diff --staged --quiet || git commit -m "🤖 Meta atualizado (sync automatico)"
          git push
